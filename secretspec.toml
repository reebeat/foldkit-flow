# The one secret the release workflow reads (spec 0005). Declared by name only: no value is stored in the repository.
# It lives as the environment secret NPM_TOKEN of the GitHub environment `npm-release` (restricted to `main`, reviewer
# phibkro). Remove it with the token, see the spec's removal checklist.
# Provenance: copied from phibkro/pg-txmode (Apache-2.0) secretspec.toml at 23be53c0c66a129540350697253b5c19abde3171;
# deviation: the project name and the npm scope. See PROVENANCE.md.
[project]
name = "foldkit-flow"
revision = "1.0"

[profiles.default]
NPM_TOKEN = { description = "Granular npm access token (read and write, scope @tsukuri, expires) used by .github/workflows/release.yml to publish", required = true }
